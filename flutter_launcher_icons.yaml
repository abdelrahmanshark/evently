#flutter pub add flutter_launcher_icons
# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/launcher_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#F2FEFF"
  adaptive_icon_foreground: "assets/images/launcher_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/launcher_icon_foreground.png"
  # The foreground image is already padded to the adaptive safe zone.
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#F2FEFF"

#flutter pub get
#dart run flutter_launcher_icons
