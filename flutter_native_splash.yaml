#  flutter pub add flutter_native_splash

flutter_native_splash:
  color: "#F2FEFF"
  color_dark: "#101127"
  #4x photo, same size as the Flutter splash logo so the handoff is seamless.
  image: assets/images/splash_icon.png
  image_dark: assets/images/splash_icon.png
  android_12:
    #App icon without an icon background should be 1152×1152 pixels, and fit within a circle 768 pixels in diameter.
    image: assets/images/splash_icon.png
    color: "#F2FEFF"
    image_dark: assets/images/splash_icon.png
    color_dark: "#101127"
  web: false
  #  dart run flutter_native_splash:create --path=flutter_native_splash.yaml
